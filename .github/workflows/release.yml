name: Release Pixora

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/api test/data test/feature

  android:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: android-arm64
            source: app-arm64-v8a-release.apk
            asset: pixora-android-arm64-v8a-release.apk
            artifact: pixora-android-arm64-v8a
          - abi: armeabi-v7a
            target: android-arm
            source: app-armeabi-v7a-release.apk
            asset: pixora-android-armeabi-v7a-release.apk
            artifact: pixora-android-armeabi-v7a
          - abi: x86_64
            target: android-x64
            source: app-x86_64-release.apk
            asset: pixora-android-x86_64-release.apk
            artifact: pixora-android-x86_64
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - name: Configure release signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_STORE_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../release.jks
          EOF
      - run: flutter pub get
      - name: Build Android ${{ matrix.abi }} APK
        run: flutter build apk --release --split-per-abi --target-platform "${{ matrix.target }}"
      - name: Prepare Android ${{ matrix.abi }} release files
        run: |
          mkdir -p release
          cp "build/app/outputs/flutter-apk/${{ matrix.source }}" "release/${{ matrix.asset }}"
          cd release
          sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows x64 Release
        run: flutter build windows --release
      - name: Prepare Windows x64 release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath release/pixora-windows-x64-release.zip -CompressionLevel Optimal
          (Get-FileHash release/pixora-windows-x64-release.zip -Algorithm SHA256).Hash.ToLower() + "  pixora-windows-x64-release.zip" | Set-Content release/pixora-windows-x64-release.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pixora-windows-x64
          path: release/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
